{% extends "layout.html" %}

{% block main %}
<h2>Transaction History</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Type</th>
            <th>Shares</th>
            <th>Price</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        {% for tx in transactions %}
        <tr>
            <td>{{ tx.symbol }}</td>
            <td>
                {% if tx.shares > 0 %}
                    BUY
                {% else %}
                    SELL
                {% endif %}
            </td>
            <td>{{ tx.shares | abs }}</td>
            <td>{{ tx.price | usd }}</td>
            <td>{{ tx.datetime }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
